id: rain_radar
version: 0.4.3
api: "0.13"
icon: weather-pouring
maintainer: MattechPC
license: MIT
stage: beta
topics: [weather]
requires:
  esphome: 2026.6.2
boards: any
flash_kb: 6

permissions:
  network: [api.rainviewer.com, tilecache.rainviewer.com, tile.openstreetmap.org]
attributes: [cloud]
privacy: https://github.com/MattechPC/Rain-Radar#privacy

tiles:
  - id: radar
    name: tile_name
    icon: weather-pouring
    sizes: { min: 1x1, max: 9x9 }
    memory: 12000
    pictures: 8
    data: frames
    example: tile_example
    preview: { title: "RainViewer", countdown: at }
    options:
      - { id: lat, kind: text, label: lat, hint: lat_hint, default: "52.2297" }
      - { id: lon, kind: text, label: lon, hint: lon_hint, default: "21.0122" }
      - { id: zoom, kind: number, min: 2, max: 7, step: 1, default: 6, label: zoom, hint: zoom_hint }
      - { id: look, kind: choice, label: look, hint: look_hint, default: auto,
          choices: [{ value: auto, label: look_auto }, { value: light, label: look_light }, { value: dark, label: look_dark }] }
      - { id: dim, kind: number, min: 0, max: 80, step: 5, unit: "%", default: 40, label: dim, hint: dim_hint }
      - { id: centering, kind: choice, label: centering, hint: centering_hint, default: "on",
          choices: [{ value: "on", label: centering_on }, { value: auto, label: centering_auto }, { value: "off", label: centering_off }] }
      - { id: fullscreen, kind: toggle, label: fullscreen, hint: fullscreen_hint, default: true }
      - { id: map, kind: toggle, label: map, hint: map_hint, default: true }
      - { id: marker_icon, kind: choice, label: marker_icon, hint: marker_icon_hint, default: dot,
          choices: [{ value: none, label: mi_none }, { value: dot, label: mi_dot }, { value: pin, label: mi_pin }, { value: pin_outline, label: mi_pin_outline },
                    { value: home, label: mi_home }, { value: home_pin, label: mi_home_pin }, { value: cross, label: mi_cross },
                    { value: heart, label: mi_heart }, { value: car, label: mi_car }, { value: tree, label: mi_tree },
                    { value: person, label: mi_person }, { value: compass, label: mi_compass }, { value: rain, label: mi_rain },
                    { value: tower, label: mi_tower }, { value: bike, label: mi_bike }] }
      - { id: marker_color, kind: choice, label: marker_color, hint: marker_color_hint, default: blue,
          choices: [{ value: blue, label: mc_blue }, { value: red, label: mc_red }, { value: green, label: mc_green },
                    { value: amber, label: mc_amber }, { value: purple, label: mc_purple }, { value: white, label: mc_white },
                    { value: black, label: mc_black }] }
      - { id: snow, kind: toggle, label: snow, hint: snow_hint, default: true }
      - { id: tiles, kind: toggle, label: tiles, hint: tiles_hint, default: false }

cards:
  - { id: radar_card, name: card_name, wide: true, pictures: 8 }

fetch:
  - id: frames
    url: https://api.rainviewer.com/public/weather-maps.json
    every: 5m
    map:
      items: "$.radar.past[*]"
      fields:
        at: { path: time, as: epoch }
        path: path
      sort: -at
      limit: 1
